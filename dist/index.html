<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ead8bc">
  <meta name="description" content="어린이의 동시와 미술 작품을 전시할 수 있는 반응형 3D 온라인 전시장">
  <title>햇살 동시 마루 — 3D 전시장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=55">
</head>
<body data-admin="false">
  <a class="skip" href="#index-panel">3D 전시를 건너뛰고 작품 목록 보기</a>
  <canvas id="gallery-canvas" aria-label="바닥을 클릭해 이동하고, 화면 아래쪽 클릭이나 휠 아래로 뒤로 이동하며, 세로 드래그로 앞뒤 이동하고 가로 드래그로 둘러보는 3D 작품 전시장"></canvas>
  <div id="loading" class="loading"><span></span><p>포근한 전시방을 준비하고 있어요</p></div>
  <div id="entry-portal" class="entry-portal" aria-hidden="true">
    <img class="entry-facade" src="assets/entrance-facade-2d.png" alt="">
    <div class="entry-doorway">
      <div class="entry-door entry-door-left"><img src="assets/door-leaf-2d.png" alt=""></div>
      <div class="entry-door entry-door-right"><img src="assets/door-leaf-2d.png" alt=""></div>
    </div>
  </div>

  <section id="intro" class="intro" aria-labelledby="intro-title">
    <div class="intro-illustrations" aria-hidden="true"><img class="intro-tree" src="assets/centerpiece-tree.png" alt=""><img class="intro-curator" src="assets/curator-maru.png" alt=""><img class="intro-mobile" src="assets/cotton-mobile.png" alt=""></div>
    <p class="kicker">어린이 창작 온라인 전시</p>
    <h1 id="intro-title"><em>햇살</em><br>동시 마루</h1>
    <p>아이들이 쓴 소중한 동시를<br>밝고 포근한 전시 공간에서 만나보세요.</p>
    <button id="enter" type="button">전시장 입장 <img class="enter-arrow" src="assets/ui-enter-arrow.png" alt="" aria-hidden="true"></button>
    <div class="intro-meta"><span>로그인 없이 입장</span><span>PC · 모바일 지원</span></div>
  </section>

  <main id="hud" class="hud" hidden>
    <header class="topbar">
      <button id="home" class="logo" type="button" aria-label="입구로 돌아가기"><img class="brand-mark" src="assets/ui-sun-mark.png" alt="" aria-hidden="true"><span>햇살 동시 마루</span></button>
      <div class="zone-label"><small>현재 구역</small><strong id="zone-name">중앙 홀</strong></div>
      <div class="top-actions">
        <button id="music-toggle" class="music-button" type="button" aria-label="전시 음악 끄기" aria-pressed="true"><img class="music-icon" src="assets/ui-music.png" alt="" aria-hidden="true"><span>음악</span></button>
        <button id="index-open" class="icon-button" type="button" aria-label="전체 작품 목록"><img class="button-icon" src="assets/ui-menu.png" alt="" aria-hidden="true"></button>
      </div>
    </header>
    <div id="crosshair" class="crosshair" aria-hidden="true"></div>
    <aside class="mini-map" aria-label="전시장 미니맵">
      <div id="map-dot" class="map-dot"></div><div id="map-view" class="map-view"></div>
      <span class="map-center" aria-hidden="true"></span><i class="map-ring"></i>
    </aside>
    <div class="mobile-controls" aria-label="이동 조작">
      <div id="move-pad" class="move-pad" aria-label="방향 이동 버튼">
        <button class="move-forward" type="button" data-move="forward">앞</button>
        <button class="move-left" type="button" data-move="left">왼쪽</button>
        <button class="move-back" type="button" data-move="back">뒤</button>
        <button class="move-right" type="button" data-move="right">오른쪽</button>
      </div>
    </div>
  </main>

  <section id="poem-modal" class="poem-modal" aria-hidden="true" aria-labelledby="poem-title">
    <div class="modal-shade" data-close></div>
    <article class="poem-card">
      <button class="modal-close close-button" type="button" data-close aria-label="작품 닫기"><img src="assets/ui-close.png" alt="" aria-hidden="true"></button>
      <div class="poem-meta"><span id="poem-dot"></span><p>어린이 작가<br><strong id="poem-child"></strong></p><em id="poem-number"></em></div>
      <h2 id="poem-title" class="sr-only">작품 원본</h2>
      <div class="poem-scan-stage">
        <img id="poem-scan" class="poem-scan" alt="" hidden>
        <div id="poem-scan-empty" class="poem-scan-empty"><strong>작품 원본 준비 중</strong><p>관리자가 스캔 이미지를 등록하면<br>아이의 작품 원본이 그대로 표시됩니다.</p></div>
      </div>
      <footer><button id="prev-poem" type="button"><img class="nav-arrow" src="assets/ui-arrow-left.png" alt="" aria-hidden="true">이전 작품</button><button id="next-poem" type="button">다음 작품<img class="nav-arrow" src="assets/ui-arrow-right.png" alt="" aria-hidden="true"></button></footer>
    </article>
  </section>

  <aside id="index-panel" class="index-panel" aria-hidden="true" aria-labelledby="index-title">
    <header><div><small>전체 작품</small><h2 id="index-title">작품 목록</h2></div><button id="index-close" class="close-button" type="button" aria-label="목록 닫기"><img src="assets/ui-close.png" alt="" aria-hidden="true"></button></header>
    <div id="index-list" class="index-list"></div>
    <p class="data-note">관리자가 등록한 아이들의 작품 원본을 그대로 감상할 수 있습니다.</p>
  </aside>

  <script type="module" src="app.js?v=55"></script>
</body>
</html>
